# MPD Config — Karma Music Player
# Generic Linux (PulseAudio/PipeWire or ALSA)

music_directory    "/nas/_AUDIO/karma"
playlist_directory "/var/lib/mpd/playlists"
db_file            "/var/lib/mpd/tag_cache"
state_file         "/var/lib/mpd/state"
sticker_file       "/var/lib/mpd/sticker.sql"
log_file           "/var/log/mpd/mpd.log"
pid_file           "/run/mpd/pid"

bind_to_address    "0.0.0.0"
port               "6600"

restore_paused     "no"

# PulseAudio output (default on Ubuntu desktop)
# If using PipeWire, this still works via pipewire-pulse compatibility
audio_output {
    type        "pulse"
    name        "Karma Audio Out"
}

# Uncomment below and comment out pulse above if using raw ALSA instead
# audio_output {
#     type        "alsa"
#     name        "Karma Audio Out"
#     device      "default"
#     mixer_type  "software"
# }

audio_buffer_size  "4096"
auto_update        "yes"
